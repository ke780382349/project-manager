spring:
  datasource:
    url: jdbc:h2:mem:project_manager_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-secret-that-is-longer-than-32-characters
    expiration: 30d
